<svg viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tq_logo_bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e1b4b" />
      <stop offset="50%" stopColor="#2e1065" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="tq_logo_rim" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <linearGradient id="tq_logo_bolt" x1="22" y1="14" x2="42" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="35%" stopColor="#38bdf8" />
      <stop offset="70%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <linearGradient id="tq_text_timeout" x1="72" y1="20" x2="160" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="60%" stopColor="#f3e8ff" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <linearGradient id="tq_text_quiz" x1="165" y1="20" x2="225" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <filter id="tq_logo_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#8b5cf6" floodOpacity="0.5" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(2, 2) scale(0.93)">
    <!-- Base Squircle -->
    <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#tq_logo_bg)" filter="url(#tq_logo_glow)" />
    <rect x="4" y="4" width="56" height="56" rx="16" stroke="url(#tq_logo_rim)" strokeWidth="1.8" />

    <!-- Crown -->
    <rect x="28" y="7" width="8" height="3.5" rx="1.5" fill="#facc15" stroke="#78350f" strokeWidth="0.8" />
    <path d="M26 10.5H38" stroke="#38bdf8" strokeWidth="1" strokeLinecap="round" />

    <!-- Dial Ring -->
    <circle cx="32" cy="34" r="20" stroke="#06b6d4" strokeWidth="2.5" strokeOpacity="0.85" strokeDasharray="3 2" />
    <circle cx="32" cy="34" r="23" stroke="#818cf8" strokeOpacity="0.3" strokeWidth="1" />

    <!-- Markers -->
    <line x1="32" y1="16" x2="32" y2="19" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" />
    <line x1="50" y1="34" x2="47" y2="34" stroke="#38bdf8" strokeWidth="2" strokeLinecap="round" />
    <line x1="32" y1="52" x2="32" y2="49" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" />
    <line x1="14" y1="34" x2="17" y2="34" stroke="#38bdf8" strokeWidth="2" strokeLinecap="round" />

    <!-- Bolt -->
    <path d="M36 17L22 35H32L28 51L44 31H34L36 17Z" fill="url(#tq_logo_bolt)" stroke="#0f172a" strokeWidth="1.2" strokeLinejoin="round" />
  </g>

  <!-- Wordmark "Timeout" -->
  <text x="68" y="36" fill="url(#tq_text_timeout)" fontFamily="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fontSize="24" fontWeight="900" letterSpacing="-0.5">Timeout</text>
  
  <!-- Wordmark "Quiz" -->
  <text x="164" y="36" fill="url(#tq_text_quiz)" fontFamily="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fontSize="24" fontWeight="900" letterSpacing="-0.5">Quiz</text>

  <!-- Tagline badge / subtitle -->
  <g transform="translate(68, 42)">
    <rect x="0" y="0" width="108" height="15" rx="4" fill="#1e1b4b" fillOpacity="0.8" stroke="#818cf8" strokeOpacity="0.3" strokeWidth="0.8" />
    <circle cx="7" cy="7.5" r="2" fill="#38bdf8" />
    <text x="14" y="11" fill="#c4b5fd" fontFamily="system-ui, -apple-system, sans-serif" fontSize="8" fontWeight="800" letterSpacing="1.2">REALTIME ARENA</text>
  </g>
</svg>
