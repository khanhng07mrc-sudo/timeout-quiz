      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="sqTailHl" x1="108" y1="92" x2="148" y2="132" gradientUnits="userSpaceOnUse">
