name: Keep Website Alive

on:
  schedule:
    # Chạy mỗi 10 phút một lần để Render không bao giờ ngủ
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Website
        run: |
          URL="https://timeout-quiz.onrender.com"
          echo "Pinging $URL to keep Render instance awake..."
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" "$URL" || true
