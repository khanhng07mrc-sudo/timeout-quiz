  <path d="M22 17H42V29C42 35 37.5 39 32 39C26.5 39 22 35 22 29V17Z" fill="url(#trophy_gold)" stroke="#78350f" stroke-width="2" />

  <!-- Handles -->
  <path d="M22 21H16C14 21 13 23 13 25C13 29 17 32 22 32" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M42 21H48C50 21 51 23 51 25C51 29 47 32 42 32" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Stem & Pedestal Base -->
