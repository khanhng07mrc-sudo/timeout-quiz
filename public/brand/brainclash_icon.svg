<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bci_shield_bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e1b4b" stopOpacity="0.95" />
      <stop offset="50%" stopColor="#2e1065" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>

    <linearGradient id="bci_rim_grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818cf8" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>

    <linearGradient id="bci_brain_left" x1="12" y1="16" x2="30" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>

    <linearGradient id="bci_brain_right" x1="34" y1="16" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0891b2" />
    </linearGradient>

    <linearGradient id="bci_bolt_grad" x1="26" y1="12" x2="38" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="45%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>

    <filter id="bci_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" floodColor="#6366f1" floodOpacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M32 4L57 14V36C57 48.5 46.5 57 32 61C17.5 57 7 48.5 7 36V14L32 4Z" 
        fill="url(#bci_shield_bg)" 
        stroke="url(#bci_rim_grad)" 
        strokeWidth="2.2" 
        filter="url(#bci_shadow)" />

  <!-- Inner Inset line -->
  <path d="M32 9L52 17V35C52 45 43.5 52 32 55.5C20.5 52 12 45 12 35V17L32 9Z" 
        stroke="#4f46e5" 
        strokeOpacity="0.4" 
        strokeWidth="1" />

  <!-- Brain Left Hemisphere -->
  <path d="M28 19C22 19 17 23 17 29C17 33.5 19.5 37 23 39L28 41V19Z" 
        fill="url(#bci_brain_left)" 
        stroke="#1e1b4b" 
        strokeWidth="0.8" />
  <path d="M23 23L28 28M19 31L26 34" 
        stroke="#ffffff" 
        strokeOpacity="0.35" 
        strokeWidth="1" 
        strokeLinecap="round" />

  <!-- Brain Right Hemisphere -->
  <path d="M36 19C42 19 47 23 47 29C47 33.5 44.5 37 41 39L36 41V19Z" 
        fill="url(#bci_brain_right)" 
        stroke="#1e1b4b" 
        strokeWidth="0.8" />
  <path d="M41 23L36 28M45 31L38 34" 
        stroke="#ffffff" 
        strokeOpacity="0.35" 
        strokeWidth="1" 
        strokeLinecap="round" />

  <!-- Central Lightning Clash Bolt -->
  <path d="M37 13L22 31H33L26 51L43 29H30L37 13Z" 
        fill="url(#bci_bolt_grad)" 
        stroke="#0f172a" 
        strokeWidth="1.4" 
        strokeLinejoin="round" />

  <!-- Center Spark Highlight -->
  <circle cx="32" cy="30" r="2" fill="#ffffff" />
</svg>
