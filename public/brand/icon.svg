    <!-- 3D Tail Shadow -->
    <path d="M 116.32 87.24 A 13 13 0 0 0 98.68 105.76 L 138.61 146.93 A 15 15 0 0 0 159.39 125.07 Z" transform="translate(0, 3.5)" fill="#0f172a" opacity="0.5" />
