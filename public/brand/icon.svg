<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tq_icon_bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e1b4b" />
      <stop offset="50%" stopColor="#2e1065" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="tq_icon_rim" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <linearGradient id="tq_timer_ring" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>
    <linearGradient id="tq_bolt_glow" x1="22" y1="14" x2="42" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="35%" stopColor="#38bdf8" />
      <stop offset="70%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <filter id="tq_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#8b5cf6" floodOpacity="0.6" />
    </filter>
    <filter id="tq_bolt_sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" floodColor="#38bdf8" floodOpacity="0.8" />
    </filter>
  </defs>

  <!-- Base Squircle Shield with Rim -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#tq_icon_bg)" filter="url(#tq_glow)" />
  <rect x="4" y="4" width="56" height="56" rx="16" stroke="url(#tq_icon_rim)" strokeWidth="1.8" />

  <!-- Stopwatch Top Winder Crown -->
  <rect x="28" y="7" width="8" height="3.5" rx="1.5" fill="#facc15" stroke="#78350f" strokeWidth="0.8" />
  <path d="M26 10.5H38" stroke="#38bdf8" strokeWidth="1" strokeLinecap="round" />

  <!-- Stopwatch Circular Dial Outer Ring -->
  <circle cx="32" cy="34" r="20" stroke="url(#tq_timer_ring)" strokeWidth="2.5" strokeOpacity="0.85" strokeDasharray="3 2" />
  <circle cx="32" cy="34" r="23" stroke="#818cf8" strokeOpacity="0.3" strokeWidth="1" />

  <!-- Hour / Minute Markers -->
  <line x1="32" y1="16" x2="32" y2="19" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" />
  <line x1="50" y1="34" x2="47" y2="34" stroke="#38bdf8" strokeWidth="2" strokeLinecap="round" />
  <line x1="32" y1="52" x2="32" y2="49" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" />
  <line x1="14" y1="34" x2="17" y2="34" stroke="#38bdf8" strokeWidth="2" strokeLinecap="round" />

  <!-- Subtle Countdown Progress Arc (3/4 circle active) -->
  <path d="M32 14A20 20 0 1 1 14 34" fill="none" stroke="#06b6d4" strokeWidth="3" strokeLinecap="round" opacity="0.6" />

  <!-- Electric Lightning Bolt (Timeout Quiz Core) -->
  <path d="M36 17L22 35H32L28 51L44 31H34L36 17Z" fill="url(#tq_bolt_glow)" stroke="#0f172a" strokeWidth="1.2" strokeLinejoin="round" filter="url(#tq_bolt_sh)" />

  <!-- Highlight Sparkle -->
  <circle cx="48" cy="18" r="1.5" fill="#ffffff" />
  <path d="M48 14L49 17L52 18L49 19L48 22L47 19L44 18L47 17L48 14Z" fill="#38bdf8" opacity="0.9" />
</svg>
