  <rect x="23" y="45" width="18" height="6" rx="2" fill="#78350f" stroke="#fef08a" stroke-width="1.5" />

  <!-- 1v1 Inscription -->
  <text x="32" y="28" fill="#78350f" font-size="7" font-weight="900" font-family="sans-serif" text-anchor="middle">1v1</text>

