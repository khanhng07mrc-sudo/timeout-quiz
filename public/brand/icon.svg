  <!-- Precision Arch Below Q -->
  <g id="sq-arch">
    <path d="M 24 172 Q 100 154 176 172 Q 100 160 24 172 Z" fill="url(#sqArchGrad)" />
    <path d="M 45 171 Q 100 156 155 171 Q 100 158 45 171 Z" fill="url(#sqArchCoreGrad)" />
  </g>

  <!-- Crisp Vector Q (Zero Blur) -->
