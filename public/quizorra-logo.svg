<svg viewBox="0 0 360 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Q Ring Gradient -->
    <linearGradient id="qz_svg_qgrad" x1="12" y1="8" x2="60" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Swoosh Gradient -->
    <linearGradient id="qz_svg_swoosh" x1="6" y1="68" x2="70" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Wordmark orra gradient -->
    <linearGradient id="qz_svg_orra" x1="165" y1="20" x2="320" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="qz_svg_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ICON (left: 0..80) -->
  <g transform="translate(6, 4)">
    <!-- Ambient halo -->
    <circle cx="36" cy="30" r="20" fill="url(#qz_svg_qgrad)" opacity="0.22" filter="url(#qz_svg_glow)" />

    <!-- Neon Q Letterform -->
    <g filter="url(#qz_svg_glow)">
      <circle
        cx="36"
        cy="30"
        r="17"
        stroke="url(#qz_svg_qgrad)"
        stroke-width="8.2"
        stroke-linecap="round"
      />
      <path
        d="M 37 32 Q 42 41 57 51"
        stroke="url(#qz_svg_qgrad)"
        stroke-width="8.2"
        stroke-linecap="round"
      />
    </g>

    <!-- Swoosh -->
    <path
      d="M 8 66 Q 36 56 66 66"
      stroke="url(#qz_svg_swoosh)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.95"
    />
  </g>

  <!-- WORDMARK: Quiz -->
  <text x="86" y="48" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="36" 
        font-weight="900" 
        letter-spacing="-1">Quiz</text>

  <!-- WORDMARK: orra -->
  <text x="168" y="48" 
        fill="url(#qz_svg_orra)" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="36" 
        font-weight="900" 
        letter-spacing="-1">orra</text>
</svg>
