<svg viewBox="0 0 280 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Q Ring Gradient -->
    <linearGradient id="qz_logo_qgrad" x1="12" y1="8" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Swoosh Gradient -->
    <linearGradient id="qz_logo_swoosh" x1="6" y1="54" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="qz_text_orra" x1="140" y1="18" x2="245" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="qz_logo_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ICON BADGE (left: 0..64) -->
  <g transform="translate(2, 0)">
    <!-- Ambient halo -->
    <circle cx="30" cy="25" r="16" fill="url(#qz_logo_qgrad)" opacity="0.2" filter="url(#qz_logo_glow)" />

    <!-- Neon Q Letterform -->
    <g filter="url(#qz_logo_glow)">
      <circle
        cx="30"
        cy="25"
        r="14"
        stroke="url(#qz_logo_qgrad)"
        stroke-width="6.8"
        stroke-linecap="round"
      />
      <path
        d="M 31 27 Q 35 34 47 42"
        stroke="url(#qz_logo_qgrad)"
        stroke-width="6.8"
        stroke-linecap="round"
      />
    </g>

    <!-- Swoosh -->
    <path
      d="M 6 55 Q 30 47 54 55"
      stroke="url(#qz_logo_swoosh)"
      stroke-width="2.6"
      stroke-linecap="round"
      opacity="0.95"
    />
  </g>

  <!-- WORDMARK: Quiz -->
  <text x="70" y="38" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="-0.5">Quiz</text>

  <!-- WORDMARK: orra -->
  <text x="135" y="38" 
        fill="url(#qz_text_orra)" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="-0.5">orra</text>

  <!-- SUBTITLE BADGE -->
  <g transform="translate(70, 45)">
    <rect x="0" y="0" width="148" height="15" rx="4" 
          fill="#1e1b4b" 
          fill-opacity="0.75" 
          stroke="#818cf8" 
          stroke-opacity="0.3" 
          stroke-width="0.8" />
    <circle cx="8" cy="7.5" r="2.2" fill="#06b6d4" />
    <text x="16" y="11" 
          fill="#c4b5fd" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="8" 
          font-weight="800" 
          letter-spacing="1.2">INTELLECTUAL ARENA</text>
  </g>
</svg>
