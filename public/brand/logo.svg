22.91 139.19Q517.20 135.57 513.89 128.89Q510.57 122.21 510.57 113.44M553.21 113.54Q553.21 107.01 549.59 103.24Q545.97 99.47 540.76 99.47Q535.56 99.47 531.94 103.19Q528.32 106.91 528.32 113.44Q528.32 119.97 531.94 123.79Q535.56 127.62 540.76 127.62Q545.97 127.62 549.59 123.84Q553.21 120.07 553.21 113.54"
    fill="#ffffff"
    filter="url(#qzTextShadow)"
  />
</svg>